name: Validate plugin catalogue

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated Codex mirror
        run: |
          bash sync-codex.sh
          git diff --exit-code -- .codex
          test -z "$(git ls-files --others --exclude-standard -- .codex)"

      - name: Validate plugins and Codex mirror
        run: python validate_plugin.py

      - name: Run marketplace source regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run VPS network evidence regression tests
        run: python -m unittest discover -s plugins/vps-support/tests -p "test_*.py"

      - name: Run Codex Toolkit review regression tests
        run: python -m unittest discover -s plugins/codex-toolkit/tests -p "test_*.py"

      - name: Run development workflow regression tests
        run: python -m unittest discover -s plugins/development-workflow/tests -p "test_*.py"

      - name: Install H2D gate dependencies
        working-directory: plugins/h2d-transfer/skills/h2d-pixel-perfect-transfer
        run: |
          python -m pip install -r requirements.txt
          # Fetch pinned tarballs from npm instead of the legacy mirror; keep integrity checks.
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=registry.npmmirror.com
          npx playwright install chromium

      - name: Run H2D integrity and browser regression tests
        run: python -m unittest discover -s plugins/h2d-transfer/tests -p "test_*.py"

  fable-superpowers-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test portable bootstrap, policy and profile
        run: python -B -m unittest discover -s codex-profile/tests -p "test_fable_superpowers_*.py"

      - name: Test task acceptance evidence and negative cases
        run: python -B -m unittest discover -s codex-profile/tests -p "test_agent_acceptance_eval.py"

      - name: Test updater contracts without credentials or model calls
        working-directory: codex-profile/fable-superpowers/scripts/updater
        run: python -B -m unittest -v test_core test_native test_source test_compatibility test_sandbox

  first-pass-quality-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run first-pass quality contract suite
        shell: pwsh
        run: ./plugins/first-pass-quality/tests/run-contract-tests.ps1

      - name: Smoke-test Codex and Claude hook commands
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./plugins/first-pass-quality/tests/run-hook-config-smoke.ps1

  windows-marketplace-acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.167.1

      - name: Exercise real marketplace add and refresh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WINDOWS_MARKETPLACE_ACCEPTANCE: "1"
        run: python -B scripts/windows-marketplace-acceptance.py
